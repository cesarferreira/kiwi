[package]
name = "kiwi-keymapper"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Run portable macOS key mappings"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/kiwi"

[[bin]]
name = "kiwi"
path = "src/main.rs"

[[bench]]
name = "engine"
harness = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
notify = "8.2.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSPanel", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSScreen", "NSTextField", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
