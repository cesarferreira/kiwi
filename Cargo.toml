[package]
name = "kiwi-keymapper"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Run portable macOS key mappings"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/kiwi"

[[bin]]
name = "kiwi"
path = "src/main.rs"

[[bench]]
name = "engine"
harness = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
notify = "8.2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
